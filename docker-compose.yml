version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: smart-campus-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: smart_campus
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: smart-campus-backend
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/smart_campus?schema=public"
      PORT: 5000
      JWT_SECRET: "supersecretjwtkey_for_development"
    depends_on:
      - db
    # In production, use wait-for-it or similar. For demo, we might rely on Prisma retries or manual migration.
    command: sh -c "npx prisma db push && node prisma/seed.js && npm start"

  frontend:
    build:
      context: ./frontend
    container_name: smart-campus-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5000
    depends_on:
      - backend

  simulation:
    build:
      context: ./simulation
    container_name: smart-campus-simulation
    environment:
      - BACKEND_URL=http://backend:5000
    depends_on:
      - backend

volumes:
  postgres_data:
